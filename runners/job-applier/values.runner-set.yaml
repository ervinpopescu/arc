githubConfigUrl: "https://github.com/ervinpopescu/job-applier"

githubConfigSecret: "pre-defined-secret"

controllerServiceAccount:
  namespace: "arc-systems"
  name: "arc-gha-rs-controller"

keyVault:
  type: ""

resourceMeta:
  noPermissionServiceAccount:
    annotations: {}
    name: ""

maxRunners: 4

minRunners: 0

template:
  spec:
    securityContext:
      fsGroup: 123
    initContainers:
      - name: fix-work-permissions
        image: ghcr.io/ervinpopescu/arc-custom-runner:ubuntu-26.04
        command: ["sudo", "chown", "-R", "1001:123", "/home/runner/_work"]
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    dnsPolicy: "ClusterFirst"
    dnsConfig:
      options:
        - name: ndots
          value: "2"
    containers:
      - name: runner
        imagePullPolicy: Always
        image: ghcr.io/ervinpopescu/arc-custom-runner:ubuntu-26.04
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s/index.js
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: [ "ReadWriteOnce" ]
              resources:
                requests:
                  storage: 2Gi

namespaceOverride: "job-applier-runners"
